[package]
name = "noc-shore"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "noc_shore"
path = "src/lib.rs"

[[bin]]
name = "noc-shore"
path = "src/main.rs"

[dependencies]
noc-common = { path = "../common" }
tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
base64 = "0.22"
async-trait = "0.1"
# Live Cloudflare Zero Trust Devices API lookup. rustls to avoid an OpenSSL
# build dependency on the shore host.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
