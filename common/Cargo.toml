[package]
name = "noc-common"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "noc_common"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
# io-util only: async read/write helpers for the shared wire protocol (wire.rs).
# Both daemons depend on common, so keeping the codec here is the single source of
# truth for the frame layout.
tokio = { version = "1", features = ["io-util"] }
# Identity handshake: ECDSA P-256 (secp256r1) nonce challenge-response - the
# vessel signs with its WARP device key (reg.json) in production, or a generated
# P-256 key in dev/test. Same curve/format WARP + the Cloudflare Devices API use.
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = { workspace = true }
rand_core = { version = "0.6", features = ["std"] }
# DeviceDirectory is an async trait object (cache-first with an async live
# Cloudflare fallback on miss), so it needs async-trait for dyn dispatch.
async-trait = "0.1"
