# Raises the maximum pipe buffer size to 16 MB for the capture FIFO.
# The default Linux pipe limit is 1 MB, but the vessel daemon needs 16 MB to prevent
# packet drops during bursts and will fail to start if this limit is not raised.
fs.pipe-max-size = 16777216

# Use BBR instead of the default CUBIC. CUBIC slows down every time a packet is lost,
# so on a lossy 4G link data piles up. In our tests 1% loss gave a 38 s delay with CUBIC
# and 0.31 s with BBR. install.sh loads the tcp_bbr module at boot (noc-bbr.conf).
net.ipv4.tcp_congestion_control = bbr
